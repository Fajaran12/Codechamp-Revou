<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- ── HEADER ── -->
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">💸 BudgetTrack</h1>
      <p class="app-subtitle">Expense & Budget Visualizer</p>
    </div>
    <button id="themeToggle" class="btn-icon" title="Toggle dark/light mode" aria-label="Toggle theme">
      🌙
    </button>
  </header>

  <!-- ── MAIN LAYOUT ── -->
  <main class="app-main">

    <!-- ── BALANCE SECTION ── -->
    <section class="balance-section glass" aria-label="Total Balance">
      <div class="balance-card">
        <span class="balance-label">Total Balance</span>
        <span class="balance-amount" id="totalBalance">Rp 0</span>
      </div>
      <div class="balance-stats">
        <div class="stat-item income">
          <span class="stat-label">Income</span>
          <span class="stat-value" id="totalIncome">Rp 0</span>
        </div>
        <div class="divider"></div>
        <div class="stat-item expense">
          <span class="stat-label">Expenses</span>
          <span class="stat-value" id="totalExpense">Rp 0</span>
        </div>
      </div>
    </section>

    <!-- ── FORM + CHART ROW ── -->
    <div class="row-two">

      <!-- ── INPUT FORM ── -->
      <section class="form-section glass" aria-label="Add Transaction">
        <h2 class="section-title">Add Transaction</h2>

        <form id="transactionForm" novalidate>

          <div class="form-group">
            <label for="itemName">Item Name</label>
            <input type="text" id="itemName" placeholder="e.g. Lunch, Bus fare…" autocomplete="off" />
            <span class="field-error" id="errorName"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount (Rp)</label>
            <input type="number" id="amount" placeholder="e.g. 25000" min="1" />
            <span class="field-error" id="errorAmount"></span>
          </div>

          <div class="form-group">
            <label for="type">Type</label>
            <select id="type">
              <option value="expense">Expense (−)</option>
              <option value="income">Income (+)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="">Select category…</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚌 Transport</option>
              <option value="Fun">🎮 Fun</option>
            </select>
            <span class="field-error" id="errorCategory"></span>
          </div>

          <!-- Custom category row -->
          <div class="form-group" id="customCategoryGroup" style="display:none;">
            <label for="customCategory">New Category Name</label>
            <input type="text" id="customCategory" placeholder="e.g. Health, Shopping…" />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">+ Add Transaction</button>
          </div>
        </form>

        <!-- Sort controls -->
        <div class="sort-bar">
          <span class="sort-label">Sort by:</span>
          <button class="btn-sort active" data-sort="date">Date</button>
          <button class="btn-sort" data-sort="amount">Amount</button>
          <button class="btn-sort" data-sort="category">Category</button>
        </div>

        <!-- Spending limit warning -->
        <div class="limit-bar">
          <label for="spendingLimit">⚠️ Spending Limit (Rp)</label>
          <input type="number" id="spendingLimit" placeholder="Set limit…" min="0" />
        </div>
        <div id="limitWarning" class="limit-warning" style="display:none;"></div>
      </section>

      <!-- ── CHART SECTION ── -->
      <section class="chart-section glass" aria-label="Spending Chart">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spendingChart" aria-label="Pie chart of spending by category" role="img"></canvas>
        </div>
        <p class="chart-empty" id="chartEmpty">No expense data yet.</p>
      </section>

    </div>

    <!-- ── TRANSACTION LIST ── -->
    <section class="list-section glass" aria-label="Transaction History">
      <h2 class="section-title">Transaction History</h2>
      <div class="transaction-list" id="transactionList" role="list">
        <p class="list-empty" id="listEmpty">No transactions yet. Add one above!</p>
      </div>
    </section>

  </main>

  <!-- ── FOOTER ── -->
  <footer class="app-footer">
    <p>&copy; 2026 BudgetTrack — Codechamp Revou</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
